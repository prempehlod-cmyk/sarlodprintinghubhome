<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customers Enquiry | SARLOD Printing Hub, Gabi</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-area="public" data-page="enquiry">
<main id="content">
  <div class="page-title"><div class="container"><h2>Customers Enquiry</h2><p>Tell us what you need and we will get back to you</p></div></div>
  <section class="sec container">
    <div class="formcard">
      <form id="enqForm">
        <div class="fg">
          <div><label for="ename">Your name *</label><input id="ename" required autocomplete="name"></div>
          <div><label for="ephone">Phone / WhatsApp *</label><input id="ephone" type="tel" required autocomplete="tel"></div>
          <div class="full"><label for="eemail">Email (optional)</label><input id="eemail" type="email" autocomplete="email"></div>
          <div class="full"><label for="service">Service needed</label><select id="service"></select></div>
          <div class="full"><label for="emsg">Details of your enquiry *</label><textarea id="emsg" required placeholder="Quantity, size, colour, deadline, etc."></textarea></div>
        </div>
        <p style="margin-top:14px"><button class="btn" type="submit">Submit enquiry</button></p>
      </form>
      <div id="enqDone" style="display:none"></div>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
